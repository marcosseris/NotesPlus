name: Release

# Every push to the default branch produces a signed release the app can self-update to.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      # Offset so CI builds always outrank the hand-built 1.0.0 (versionCode 1).
      VERSION_CODE: ${{ 100 + github.run_number }}
      VERSION_NAME: 1.0.${{ 100 + github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (optional secret; falls back to signing/notesplus-release.jks)
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTESPLUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NOTESPLUS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "NOTESPLUS_KEYSTORE_PASSWORD=${{ secrets.NOTESPLUS_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "NOTESPLUS_KEY_ALIAS=${{ secrets.NOTESPLUS_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "NOTESPLUS_KEY_PASSWORD=${{ secrets.NOTESPLUS_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "Using the keystore committed in signing/."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build signed release APK
        env:
          NOTESPLUS_VERSION_CODE: ${{ env.VERSION_CODE }}
          NOTESPLUS_VERSION_NAME: ${{ env.VERSION_NAME }}
          NOTESPLUS_CLIENT_ID: ${{ secrets.NOTESPLUS_CLIENT_ID }}
          NOTESPLUS_GOOGLE_CLIENT_ID: ${{ secrets.NOTESPLUS_GOOGLE_CLIENT_ID }}
        run: ./gradlew --no-daemon :app:assembleRelease -PNOTESPLUS_CLIENT_ID="$NOTESPLUS_CLIENT_ID" -PNOTESPLUS_GOOGLE_CLIENT_ID="$NOTESPLUS_GOOGLE_CLIENT_ID"

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NotesPlus-${VERSION_NAME}.apk"
          SHA=$(sha256sum "dist/NotesPlus-${VERSION_NAME}.apk" | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"%s","sha256":"%s"}\n' "$VERSION_CODE" "$VERSION_NAME" "$SHA" > dist/latest.json
          cat dist/latest.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: |
            dist/NotesPlus-${{ env.VERSION_NAME }}.apk
            dist/latest.json
